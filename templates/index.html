<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LazyOwnInfiniteStorage</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background-color: #0a0a0a; color: #e0e0e0; }
.container { max-width: 720px; }
.terminal { font-family: 'Courier New', monospace; }
.header { border-bottom: 1px solid #333; margin-bottom: 2rem; padding-bottom: 1rem; }
.header h1 { color: #00ff41; font-family: 'Courier New', monospace; font-size: 1.5rem; }
label { color: #aaa; font-size: 0.875rem; }
input, select { background-color: #1a1a1a !important; border: 1px solid #333 !important; color: #e0e0e0 !important; }
input:focus, select:focus { border-color: #00ff41 !important; box-shadow: 0 0 0 0.2rem rgba(0,255,65,0.25) !important; }
.btn-primary { background-color: #00ff41; border-color: #00ff41; color: #000; font-weight: 600; }
.btn-primary:hover { background-color: #00cc34; border-color: #00cc34; }
.btn-success { background-color: #007bff; border-color: #007bff; }
.alert { border-radius: 0; }
</style>
</head>
<body>
<div class="container py-4">
<div class="header">
<h1 class="terminal">LazyOwnInfiniteStorage</h1>
<p class="text-muted small terminal">encode any file into video frames &mdash; decode it back</p>
</div>
<form method="post" enctype="multipart/form-data">
<div class="row g-3">
<div class="col-12">
<label class="form-label">Mode</label>
<select name="action" class="form-select">
<option value="encode">Encode</option>
<option value="decode">Decode</option>
</select>
</div>
<div class="col-12">
<label class="form-label">Input File</label>
<input type="file" name="input_file" class="form-control" required>
</div>
<div class="col-12">
<label class="form-label">Output Filename</label>
<input type="text" name="output_file_name" class="form-control" value="output" required>
</div>
<div class="col-12">
<label class="form-label">Protocol</label>
<select name="protocol" class="form-select">
<option value="secure">Secure (v2) &mdash; recommended</option>
<option value="legacy">Legacy (v1)</option>
</select>
</div>
<div class="col-md-6">
<label class="form-label">Frame Width</label>
<input type="number" name="frame_width" class="form-control" value="640" min="64" max="4096" step="1">
</div>
<div class="col-md-6">
<label class="form-label">Frame Height</label>
<input type="number" name="frame_height" class="form-control" value="480" min="64" max="4096" step="1">
</div>
<div class="col-md-6">
<label class="form-label">FPS</label>
<input type="number" name="fps" class="form-control" value="30" min="1" max="120" step="1">
</div>
<div class="col-md-6">
<label class="form-label">Block Size</label>
<input type="number" name="block_size" class="form-control" value="4" min="1" max="64" step="1">
</div>
<div class="col-12">
<button type="submit" class="btn btn-primary w-100">Start</button>
</div>
</div>
</form>
{% if result %}
<div class="alert alert-info mt-4 terminal">{{ result }}</div>
{% endif %}
{% if download_url %}
<a href="{{ download_url }}" class="btn btn-success w-100 mt-2">Download Output</a>
{% endif %}
</div>
</body>
</html>
